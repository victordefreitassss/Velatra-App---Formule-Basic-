name: Mobile browser regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - name: Locked browser tooling
        run: npm ci
      - name: Isolated component browser tests (not physical iPhone tests)
        run: node scripts/qa/mobile-foundations-browser.mjs
      - name: Browser evidence (synthetic fixtures only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-browser-evidence
          path: |
            mobile-review-evidence/results.json
            mobile-review-evidence/*.png
            mobile-review-evidence/bundle-map.json
          retention-days: 7
          if-no-files-found: warn
