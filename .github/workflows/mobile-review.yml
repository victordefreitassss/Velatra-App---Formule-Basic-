name: Mobile browser regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - name: Locked browser tooling
        run: npm ci
      - name: Sentry privacy, React boundary and missing DSN (isolated transport)
        run: node scripts/qa/sentry-browser.mjs
      - name: Super Admin purge confirmation and truthful outcomes (isolated fixtures)
        run: node scripts/qa/super-admin-purge-browser.mjs
      - name: Isolated component browser tests (not physical iPhone tests)
        run: node scripts/qa/mobile-foundations-browser.mjs
      - name: Role and format functional experiences (isolated Firebase fixtures)
        env:
          VELATRA_ROLE_QA_OUTPUT: ${{ runner.temp }}/role-format-evidence
        run: node scripts/qa/role-format-experiences-browser.mjs
      - name: Pulse and impacted Home (isolated Firebase fixtures)
        env:
          VELATRA_PULSE_QA_OUTPUT: ${{ runner.temp }}/pulse-evidence
        run: node scripts/qa/pulse-browser.mjs
      - name: Retain with Pulse and Home (isolated Firebase fixtures)
        env:
          VELATRA_RETAIN_QA_OUTPUT: ${{ runner.temp }}/retain-evidence
        run: node scripts/qa/retain-browser.mjs
      - name: Sales with CRM, trial Planning and Pulse (isolated Firebase fixtures)
        env:
          VELATRA_SALES_QA_OUTPUT: ${{ runner.temp }}/sales-evidence
        run: node scripts/qa/sales-browser.mjs
      - name: Post-sale onboarding with Home, Client360 and Pulse (synthetic fixtures)
        env:
          VELATRA_ONBOARDING_QA_OUTPUT: ${{ runner.temp }}/onboarding-evidence
        run: node scripts/qa/onboarding-browser.mjs
      - name: Legacy account migration activates modern experiences (synthetic fixtures)
        env:
          VELATRA_ACCOUNT_MIGRATION_QA: 'true'
          VELATRA_RETAIN_QA_OUTPUT: ${{ runner.temp }}/account-migration-evidence
        run: node --import tsx scripts/qa/retain-browser.mjs
      - name: Notifications, roles, pagination and explicit push permission (FCM mocked)
        env:
          VELATRA_NOTIFICATIONS_QA_OUTPUT: ${{ runner.temp }}/notifications-evidence
        run: node scripts/qa/notifications-browser.mjs
      - name: Browser evidence (synthetic fixtures only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-browser-evidence
          path: |
            mobile-review-evidence/results.json
            mobile-review-evidence/*.png
            mobile-review-evidence/bundle-map.json
            ${{ runner.temp }}/role-format-evidence/results.json
            ${{ runner.temp }}/role-format-evidence/*.png
            ${{ runner.temp }}/pulse-evidence/results.json
            ${{ runner.temp }}/pulse-evidence/*.png
            ${{ runner.temp }}/retain-evidence/results.json
            ${{ runner.temp }}/retain-evidence/*.png
            ${{ runner.temp }}/sales-evidence/results.json
            ${{ runner.temp }}/sales-evidence/*.png
            ${{ runner.temp }}/onboarding-evidence/results.json
            ${{ runner.temp }}/onboarding-evidence/*.png
            ${{ runner.temp }}/account-migration-evidence/results.json
            ${{ runner.temp }}/account-migration-evidence/*.png
            ${{ runner.temp }}/notifications-evidence/results.json
            ${{ runner.temp }}/notifications-evidence/*.png
          retention-days: 7
          if-no-files-found: warn
