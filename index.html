
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velatra — Le logiciel de coaching sportif tout-en-un</title>
    <meta name="description" content="Centralisez vos adhérents, programmes sportifs, suivi, planning et outils de gestion dans Velatra, la plateforme pensée pour les coachs sportifs." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f7f9f8" />
    <meta property="og:title" content="Velatra — Gérez votre coaching. Pas votre administratif." />
    <meta property="og:description" content="Clients, programmes, planning et suivi : réunissez votre activité de coaching dans Velatra." />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="Velatra">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap');
      
      :root {
        --velatra-accent: #10b981;
        --velatra-accent-dark: #059669;
        --velatra-page: #f7f9f8;
        --velatra-border: #e4e9e6;
      }

      body {
        background-color: var(--velatra-page);
        color: #18181b; /* zinc-900 */
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 15px;
        letter-spacing: normal;
        line-height: 1.55;
        font-weight: 400;
        margin: 0;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        min-height: 100vh;
      }

      h1, h2, h3, h4, h5, h6, .font-display {
        font-family: 'Outfit', sans-serif;
      }

      .premium-gradient {
        background: linear-gradient(135deg, #ffffff 0%, #f6f8f7 100%);
      }

      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--velatra-border);
      }

      .glass-card {
        background: #ffffff;
        border: 1px solid var(--velatra-border);
        box-shadow: 0 8px 24px -20px rgba(15, 23, 42, 0.35);
      }

      .font-mono-timer {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Transitions */
      .page-transition {
        animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(12px); filter: blur(4px); }
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.2);
      }

      :focus-visible {
        outline: 3px solid rgba(16, 185, 129, 0.55);
        outline-offset: 2px;
      }

      ::selection {
        color: #064e3b;
        background: rgba(16, 185, 129, 0.2);
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
              serif: ['Cormorant Garamond', 'serif'],
            },
            colors: {
              velatra: {
                bg: '#f7f9f8',
                bgLight: '#f1f5f3',
                bgCard: '#ffffff',
                border: '#e4e9e6',
                accent: '#10b981',
                accentDark: '#059669',
                textMuted: '#71717a',
                textDark: '#18181b',
                success: '#10b981',
                warning: '#f59e0b',
                blue: '#3b82f6',
                pink: '#ec4899',
                purple: '#a855f7',
                orange: '#f97316',
                coaching: '#10b981'
              }
            }
          }
        }
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",

    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "firebase/": "https://esm.sh/firebase@^12.9.0/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
